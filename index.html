<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Curso de Português</title>

    <meta
        name="description"
        content="Recursos y materiales del Curso de Português"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #f7f7f5;
            --surface: #ffffff;
            --text: #181818;
            --muted: #777777;
            --border: #e8e8e8;
            --accent: #087f5b;
            --accent-dark: #056044;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            --radius: 18px;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: var(--background);
            color: var(--text);
            line-height: 1.5;
        }

        button,
        input {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 100;

            background: rgba(255, 255, 255, 0.92);

            backdrop-filter: blur(14px);

            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1150px;
            margin: auto;

            padding: 16px 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand span {
            color: var(--accent);
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1150px;
            margin: auto;

            padding: 35px 22px 70px;
        }

        /* =========================
           HERO / PORTADA
        ========================= */

        .hero {
            position: relative;
            overflow: hidden;

            min-height: 370px;

            border-radius: 28px;

            background: #222;

            display: flex;
            align-items: flex-end;

            box-shadow: var(--shadow);
        }

        .hero-image {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.72),
                    rgba(0, 0, 0, 0.12) 70%
                );
        }

        .hero-content {
            position: relative;
            z-index: 2;

            padding: 40px;

            color: white;
        }

        .hero-content h1 {
            font-size: clamp(34px, 6vw, 58px);

            line-height: 1;

            letter-spacing: -2px;

            margin-bottom: 14px;
        }

        .hero-content p {
            font-size: 17px;

            max-width: 550px;

            color: rgba(255,255,255,0.88);
        }

        /* =========================
           SECTION
        ========================= */

        section {
            margin-top: 55px;
        }

        .section-header {
            display: flex;

            justify-content: space-between;
            align-items: end;

            gap: 20px;

            margin-bottom: 22px;
        }

        .section-title {
            font-size: 27px;

            letter-spacing: -0.7px;
        }

        .section-subtitle {
            color: var(--muted);

            font-size: 14px;

            margin-top: 4px;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-box {
            position: relative;

            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;

            padding: 15px 18px 15px 48px;

            border: 1px solid var(--border);

            border-radius: 14px;

            background: var(--surface);

            outline: none;

            transition: 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 0 3px
                rgba(8, 127, 91, 0.08);
        }

        .search-icon {
            position: absolute;

            left: 18px;
            top: 50%;

            transform: translateY(-50%);

            color: var(--muted);
        }

        /* =========================
           NEWS CAROUSEL
        ========================= */

        .news-wrapper {
            position: relative;
        }

        .news-container {
            display: flex;

            gap: 16px;

            overflow-x: auto;

            scroll-behavior: smooth;

            scrollbar-width: none;

            padding: 5px 2px 15px;
        }

        .news-container::-webkit-scrollbar {
            display: none;
        }

        .news-card {
            flex: 0 0 min(360px, 85vw);

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: var(--radius);

            padding: 22px;

            box-shadow: var(--shadow);

            display: flex;

            flex-direction: column;

            min-height: 190px;
        }

        .news-date {
            color: var(--accent);

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.7px;

            margin-bottom: 10px;
        }

        .news-title {
            font-size: 20px;

            line-height: 1.25;

            margin-bottom: 10px;
        }

        .news-text {
            color: var(--muted);

            font-size: 14px;

            display: -webkit-box;

            -webkit-line-clamp: 5;

            -webkit-box-orient: vertical;

            overflow: hidden;

            white-space: pre-line;
        }

        .news-controls {
            display: flex;

            gap: 8px;

            margin-top: 12px;
        }

        .circle-button {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            border: 1px solid var(--border);

            background: white;

            cursor: pointer;

            transition: 0.2s;
        }

        .circle-button:hover {
            background: var(--accent);

            color: white;

            border-color: var(--accent);
        }

        /* =========================
           RESOURCE FILTERS
        ========================= */

        .filters {
            display: flex;

            flex-wrap: wrap;

            gap: 9px;

            margin-bottom: 24px;
        }

        .filter-button {
            border: 1px solid var(--border);

            background: var(--surface);

            padding: 9px 15px;

            border-radius: 999px;

            cursor: pointer;

            color: #555;

            transition: 0.2s;
        }

        .filter-button:hover,
        .filter-button.active {
            background: var(--accent);

            border-color: var(--accent);

            color: white;
        }

        /* =========================
           RESOURCE GRID
        ========================= */

        .resource-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(240px, 1fr)
                );

            gap: 17px;
        }

        .resource-card {
            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: var(--radius);

            overflow: hidden;

            transition:
                transform 0.2s,
                box-shadow 0.2s;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.03);
        }

        .resource-card:hover {
            transform: translateY(-3px);

            box-shadow: var(--shadow);
        }

        .resource-preview {
            height: 145px;

            background: #f1f1ef;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .resource-preview img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            cursor: pointer;
        }

        .resource-preview video {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .resource-icon {
            font-size: 43px;
        }

        .resource-content {
            padding: 18px;
        }

        .resource-type {
            font-size: 11px;

            color: var(--accent);

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.7px;

            margin-bottom: 5px;
        }

        .resource-name {
            font-size: 17px;

            font-weight: 650;

            overflow-wrap: anywhere;

            margin-bottom: 15px;
        }

        .resource-actions {
            display: flex;

            gap: 8px;
        }

        .resource-button {
            flex: 1;

            border: 1px solid var(--border);

            background: white;

            padding: 9px 10px;

            border-radius: 10px;

            cursor: pointer;

            text-align: center;

            font-size: 13px;

            transition: 0.2s;
        }

        .resource-button.primary {
            background: var(--accent);

            color: white;

            border-color: var(--accent);
        }

        .resource-button:hover {
            opacity: 0.86;
        }

        /* =========================
           AUDIO / MÚSICA
        ========================= */

        .audio-preview {
            width: 100%;

            padding: 18px;
        }

        .audio-icon {
            text-align: center;

            font-size: 38px;

            margin-bottom: 12px;
        }

        .audio-preview audio {
            width: 100%;
        }

        /* =========================
           EMPTY / LOADING
        ========================= */

        .message {
            padding: 35px 20px;

            text-align: center;

            color: var(--muted);

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: var(--radius);
        }

        .loading {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 10px;
        }

        .spinner {
            width: 18px;
            height: 18px;

            border: 2px solid #ddd;

            border-top-color: var(--accent);

            border-radius: 50%;

            animation:
                spin 0.7s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            border-top: 1px solid var(--border);

            background: white;

            text-align: center;

            padding: 25px 20px;

            color: var(--muted);

            font-size: 13px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            main {
                padding: 20px 14px 50px;
            }

            .hero {
                min-height: 330px;

                border-radius: 22px;
            }

            .hero-content {
                padding: 25px;
            }

            .hero-content h1 {
                letter-spacing: -1.5px;
            }

            section {
                margin-top: 40px;
            }

            .section-title {
                font-size: 24px;
            }

            .resource-grid {
                grid-template-columns: 1fr;
            }

            .resource-preview {
                height: 170px;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="header-inner">

        <div class="brand">
            Curso de <span>Português</span>
        </div>

    </div>

</header>

<main>

<!-- =========================
     PORTADA
========================== -->

<div class="hero">

    <img
        class="hero-image"
        src="recursos/portada/IMG_3317.jpeg"
        alt="Portada del Curso de Português"
        onerror="this.style.display='none';"
    >

    <div class="hero-overlay"></div>

    <div class="hero-content">

        <h1>
            Curso de Português
        </h1>

        <p>
            Recursos y materiales para acompañar
            el aprendizaje del idioma portugués.
        </p>

    </div>

</div>

<!-- =========================
     NOTICIAS
========================== -->

<section id="noticias">

    <div class="section-header">

        <div>

            <h2 class="section-title">
                Noticias recientes
            </h2>

            <p class="section-subtitle">
                Novedades y avisos del curso
            </p>

        </div>

        <div class="news-controls">

            <button
                class="circle-button"
                onclick="scrollNews(-1)"
                aria-label="Noticias anteriores"
            >
                ←
            </button>

            <button
                class="circle-button"
                onclick="scrollNews(1)"
                aria-label="Siguientes noticias"
            >
                →
            </button>

        </div>

    </div>

    <div
        id="newsContainer"
        class="news-container"
    >

        <div class="message">

            <div class="loading">

                <div class="spinner"></div>

                Cargando noticias...

            </div>

        </div>

    </div>

</section>

<!-- =========================
     RECURSOS
========================== -->

<section id="recursos">

    <div class="section-header">

        <div>

            <h2 class="section-title">
                Recursos del curso
            </h2>

            <p
                id="resourceCounter"
                class="section-subtitle"
            >
                Cargando recursos...
            </p>

        </div>

    </div>

    <div class="search-box">

        <span class="search-icon">
            🔍
        </span>

        <input
            id="searchInput"
            type="search"
            placeholder="Buscar recursos..."
            autocomplete="off"
        >

    </div>

    <div
        id="filters"
        class="filters"
    ></div>

    <div
        id="resourceGrid"
        class="resource-grid"
    >

        <div class="message">

            <div class="loading">

                <div class="spinner"></div>

                Cargando recursos...

            </div>

        </div>

    </div>

</section>

</main>

<footer>

    Curso de Português · Recursos educativos

</footer>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const GITHUB_USER = "iamgeolh";

const GITHUB_REPO = "curso-de-portugues";

const GITHUB_BRANCH = "main";

/*
    ESTRUCTURA DEL REPOSITORIO

    recursos/
    ├── portada/
    ├── imagenes/
    ├── pdf/
    ├── audio/
    ├── musica/
    └── video/

    Cada carpeta se consulta por separado.

    IMPORTANTE:

    "portada/" NO forma parte de los recursos.

    Por tanto IMG_3317.jpeg nunca aparecerá
    dentro de la categoría Imágenes.
*/

const RESOURCE_FOLDERS = {

    "Imágenes": "recursos/imagenes",

    "Documentos": "recursos/pdf",

    "Audio": "recursos/audio",

    "Música": "recursos/musica",

    "Video": "recursos/video"

};

const NEWS_FOLDER = "noticias";

/* =========================================================
   VARIABLES
========================================================= */

let allResources = [];

let currentFilter = "Todos";

let currentSearch = "";

/* =========================================================
   API DE GITHUB
========================================================= */

async function githubContents(path) {

    const url =
        `https://api.github.com/repos/` +
        `${GITHUB_USER}/` +
        `${GITHUB_REPO}/contents/` +
        `${path}?ref=${GITHUB_BRANCH}`;

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            `No se pudo acceder a ${path}`
        );

    }

    return await response.json();

}

/* =========================================================
   OBTENER ARCHIVOS DE UNA CARPETA
========================================================= */

async function getFilesFromFolder(path) {

    const items =
        await githubContents(path);

    return items.filter(
        item => item.type === "file"
    );

}

/* =========================================================
   TIPO DE ARCHIVO
========================================================= */

function getFileType(filename) {

    const extension =
        filename
            .split(".")
            .pop()
            .toLowerCase();

    if (extension === "pdf") {

        return "Documentos";

    }

    if (
        [
            "jpg",
            "jpeg",
            "png",
            "gif",
            "webp",
            "svg"
        ].includes(extension)
    ) {

        return "Imágenes";

    }

    if (
        [
            "mp3",
            "wav",
            "ogg",
            "m4a",
            "aac"
        ].includes(extension)
    ) {

        return "Audio";

    }

    if (
        [
            "mp4",
            "webm",
            "mov",
            "m4v",
            "avi"
        ].includes(extension)
    ) {

        return "Video";

    }

    return null;

}

/* =========================================================
   NOMBRE BONITO
========================================================= */

function prettyName(filename) {

    let name =
        filename
            .split("/")
            .pop();

    name =
        name.replace(
            /\.[^/.]+$/,
            ""
        );

    name =
        name.replace(
            /[-_]+/g,
            " "
        );

    name =
        name.replace(
            /\b\w/g,
            letter =>
                letter.toUpperCase()
        );

    return name;

}

/* =========================================================
   ICONOS
========================================================= */

function getIcon(type) {

    switch (type) {

        case "Documentos":
            return "📄";

        case "Imágenes":
            return "🖼️";

        case "Audio":
            return "🎧";

        case "Música":
            return "🎵";

        case "Video":
            return "🎬";

        default:
            return "📁";

    }

}

/* =========================================================
   CARGAR RECURSOS
========================================================= */

async function loadResources() {

    const grid =
        document.getElementById(
            "resourceGrid"
        );

    try {

        const folderEntries =
            Object.entries(
                RESOURCE_FOLDERS
            );

        const results =
            await Promise.all(
                folderEntries.map(
                    async ([type, folder]) => {

                        const files =
                            await getFilesFromFolder(
                                folder
                            );

                        return files
                            .map(file => {

                                const detectedType =
                                    getFileType(
                                        file.name
                                    );

                                if (
                                    type !== "Música" &&
                                    detectedType !== type
                                ) {

                                    return null;

                                }

                                if (
                                    type === "Música" &&
                                    ![
                                        "mp3",
                                        "wav",
                                        "ogg",
                                        "m4a",
                                        "aac"
                                    ].includes(
                                        file.name
                                            .split(".")
                                            .pop()
                                            .toLowerCase()
                                    )
                                ) {

                                    return null;

                                }

                                return {

                                    name:
                                        prettyName(
                                            file.name
                                        ),

                                    type:
                                        type,

                                    url:
                                        file.html_url,

                                    rawUrl:
                                        file.download_url,

                                    path:
                                        file.path,

                                    filename:
                                        file.name

                                };

                            })
                            .filter(Boolean);

                    }
                )
            );

        allResources =
            results.flat();

        allResources.sort(
            (a, b) =>
                a.name.localeCompare(
                    b.name,
                    "es",
                    {
                        sensitivity: "base"
                    }
                )
        );

        createFilters();

        renderResources();

    }
    catch (error) {

        console.error(
            "Error cargando recursos:",
            error
        );

        grid.innerHTML = `

            <div class="message">

                No se pudieron cargar los recursos.

                <br><br>

                Comprueba que el repositorio de GitHub
                sea público y que los datos de configuración
                sean correctos.

            </div>

        `;

        document.getElementById(
            "resourceCounter"
        ).textContent =
            "No se pudieron cargar los recursos.";

    }

}

/* =========================================================
   FILTROS
========================================================= */

function createFilters() {

    const container =
        document.getElementById(
            "filters"
        );

    const types = [

        "Todos",

        "Documentos",

        "Imágenes",

        "Audio",

        "Música",

        "Video"

    ];

    container.innerHTML = "";

    types.forEach(type => {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "filter-button" +
            (
                type === "Todos"
                    ? " active"
                    : ""
            );

        button.textContent =
            `${getIcon(type)} ${type}`;

        button.onclick = () => {

            currentFilter =
                type;

            document
                .querySelectorAll(
                    ".filter-button"
                )
                .forEach(btn =>
                    btn.classList.remove(
                        "active"
                    )
                );

            button.classList.add(
                "active"
            );

            renderResources();

        };

        container.appendChild(
            button
        );

    });

}

/* =========================================================
   MOSTRAR RECURSOS
========================================================= */

function renderResources() {

    const grid =
        document.getElementById(
            "resourceGrid"
        );

    let resources =
        [...allResources];

    /*
        FILTRO POR TIPO
    */

    if (
        currentFilter !== "Todos"
    ) {

        resources =
            resources.filter(
                resource =>
                    resource.type ===
                    currentFilter
            );

    }

    /*
        BUSCADOR
    */

    if (
        currentSearch.trim() !== ""
    ) {

        const search =
            currentSearch
                .toLowerCase()
                .trim();

        resources =
            resources.filter(
                resource =>
                    resource.name
                        .toLowerCase()
                        .includes(search)
            );

    }

    /*
        CONTADOR
    */

    document.getElementById(
        "resourceCounter"
    ).textContent =

        `${resources.length} recurso` +

        `${
            resources.length === 1
                ? ""
                : "s"
        }`;

    /*
        SIN RESULTADOS
    */

    if (
        resources.length === 0
    ) {

        grid.innerHTML = `

            <div class="message">

                No se encontraron recursos.

            </div>

        `;

        return;

    }

    grid.innerHTML = "";

    resources.forEach(
        resource => {

            const card =
                createResourceCard(
                    resource
                );

            grid.appendChild(
                card
            );

        }
    );

}

/* =========================================================
   CREAR TARJETA
========================================================= */

function createResourceCard(
    resource
) {

    const card =
        document.createElement(
            "article"
        );

    card.className =
        "resource-card";

    const preview =
        document.createElement(
            "div"
        );

    preview.className =
        "resource-preview";

    /* =====================================================
       IMÁGENES
    ===================================================== */

    if (
        resource.type === "Imágenes"
    ) {

        const image =
            document.createElement(
                "img"
            );

        image.src =
            resource.rawUrl;

        image.alt =
            resource.name;

        image.loading =
            "lazy";

        image.onclick = () => {

            window.open(
                resource.rawUrl,
                "_blank",
                "noopener"
            );

        };

        preview.appendChild(
            image
        );

    }

    /* =====================================================
       AUDIO
    ===================================================== */

    else if (
        resource.type === "Audio"
    ) {

        preview.innerHTML = `

            <div class="audio-preview">

                <div class="audio-icon">
                    🎧
                </div>

                <audio
                    controls
                    preload="none"
                >

                    <source
                        src="${escapeAttribute(
                            resource.rawUrl
                        )}"
                    >

                    Tu navegador no puede
                    reproducir este audio.

                </audio>

            </div>

        `;

    }

    /* =====================================================
       MÚSICA
    ===================================================== */

    else if (
        resource.type === "Música"
    ) {

        preview.innerHTML = `

            <div class="audio-preview">

                <div class="audio-icon">
                    🎵
                </div>

                <audio
                    controls
                    preload="none"
                >

                    <source
                        src="${escapeAttribute(
                            resource.rawUrl
                        )}"
                    >

                    Tu navegador no puede
                    reproducir esta música.

                </audio>

            </div>

        `;

    }

    /* =====================================================
       VIDEO
    ===================================================== */

    else if (
        resource.type === "Video"
    ) {

        const video =
            document.createElement(
                "video"
            );

        video.src =
            resource.rawUrl;

        video.controls =
            true;

        video.preload =
            "metadata";

        video.setAttribute(
            "playsinline",
            ""
        );

        preview.appendChild(
            video
        );

    }

    /* =====================================================
       DOCUMENTOS
    ===================================================== */

    else {

        preview.innerHTML = `

            <div class="resource-icon">

                ${getIcon(
                    resource.type
                )}

            </div>

        `;

    }

    /* =====================================================
       CONTENIDO
    ===================================================== */

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "resource-content";

    let actions = "";

    /* =========================
       DOCUMENTOS
    ========================= */

    if (
        resource.type === "Documentos"
    ) {

        actions = `

            <a
                class="resource-button primary"
                href="${escapeAttribute(
                    resource.rawUrl
                )}"
                download
            >
                Descargar
            </a>

        `;

    }

    /* =========================
       IMAGEN
    ========================= */

    else if (
        resource.type === "Imágenes"
    ) {

        actions = `

            <a
                class="resource-button primary"
                href="${escapeAttribute(
                    resource.rawUrl
                )}"
                target="_blank"
                rel="noopener"
            >
                Ver
            </a>

            <a
                class="resource-button"
                href="${escapeAttribute(
                    resource.rawUrl
                )}"
                download
            >
                Descargar
            </a>

        `;

    }

    /* =========================
       AUDIO / MÚSICA
    ========================= */

    else if (
        resource.type === "Audio" ||
        resource.type === "Música"
    ) {

        actions = `

            <a
                class="resource-button primary"
                href="${escapeAttribute(
                    resource.rawUrl
                )}"
                download
            >
                Descargar
            </a>

        `;

    }

    /* =========================
       VIDEO
    ========================= */

    else if (
        resource.type === "Video"
    ) {

        actions = `

            <a
                class="resource-button primary"
                href="${escapeAttribute(
                    resource.rawUrl
                )}"
                download
            >
                Descargar
            </a>

        `;

    }

    content.innerHTML = `

        <div class="resource-type">

            ${getIcon(
                resource.type
            )}

            ${escapeHTML(
                resource.type
            )}

        </div>

        <div class="resource-name">

            ${escapeHTML(
                resource.name
            )}

        </div>

        <div class="resource-actions">

            ${actions}

        </div>

    `;

    card.appendChild(
        preview
    );

    card.appendChild(
        content
    );

    return card;

}

/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}

/* =========================================================
   ESCAPAR ATRIBUTOS
========================================================= */

function escapeAttribute(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

}

/* =========================================================
   BUSCADOR
========================================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        event => {

            currentSearch =
                event.target.value;

            renderResources();

        }
    );

/* =========================================================
   NOTICIAS
========================================================= */

async function loadNews() {

    const container =
        document.getElementById(
            "newsContainer"
        );

    try {

        const files =
            await getFilesRecursively(
                NEWS_FOLDER
            );

        const textFiles =
            files.filter(
                file => {

                    const extension =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();

                    return (
                        extension ===
                        "txt"
                    );

                }
            );

        textFiles.sort(
            (a, b) =>
                b.name.localeCompare(
                    a.name
                )
        );

        if (
            textFiles.length === 0
        ) {

            container.innerHTML = `

                <div class="message">

                    No hay noticias disponibles.

                </div>

            `;

            return;

        }

        container.innerHTML = "";

        for (
            const file
            of textFiles
        ) {

            const rawUrl =
                `https://raw.githubusercontent.com/` +
                `${GITHUB_USER}/` +
                `${GITHUB_REPO}/` +
                `${GITHUB_BRANCH}/` +
                `${file.path}`;

            const response =
                await fetch(
                    rawUrl
                );

            const text =
                await response.text();

            const news =
                parseNews(
                    text,
                    file.name
                );

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "news-card";

            card.innerHTML = `

                <div class="news-date">

                    ${escapeHTML(
                        news.date
                    )}

                </div>

                <h3 class="news-title">

                    ${escapeHTML(
                        news.title
                    )}

                </h3>

                <p class="news-text">

                    ${escapeHTML(
                        news.content
                    )}

                </p>

            `;

            container.appendChild(
                card
            );

        }

    }
    catch (error) {

        console.error(
            "Error cargando noticias:",
            error
        );

        container.innerHTML = `

            <div class="message">

                No se pudieron cargar las noticias.

            </div>

        `;

    }

}

/* =========================================================
   FUNCIÓN PARA NOTICIAS RECURSIVAS
========================================================= */

async function getFilesRecursively(path) {

    const items =
        await githubContents(
            path
        );

    let files = [];

    for (
        const item
        of items
    ) {

        if (
            item.type === "file"
        ) {

            files.push(
                item
            );

        }

        else if (
            item.type === "dir"
        ) {

            const children =
                await getFilesRecursively(
                    item.path
                );

            files =
                files.concat(
                    children
                );

        }

    }

    return files;

}

/* =========================================================
   INTERPRETAR NOTICIA
========================================================= */

function parseNews(
    text,
    filename
) {

    const lines =
        text.split(
            /\r?\n/
        );

    let title =
        prettyName(
            filename
        );

    let date =
        "";

    let content =
        text.trim();

    if (
        lines.length > 0
    ) {

        title =
            lines[0].trim();

    }

    if (
        lines.length > 1
    ) {

        date =
            lines[1].trim();

    }

    if (
        lines.length > 2
    ) {

        content =
            lines
                .slice(2)
                .join("\n")
                .trim();

    }

    return {

        title,

        date,

        content

    };

}

/* =========================================================
   CARRUSEL DE NOTICIAS
========================================================= */

function scrollNews(
    direction
) {

    const container =
        document.getElementById(
            "newsContainer"
        );

    const amount =
        container.clientWidth *
        0.8;

    container.scrollBy({

        left:
            amount * direction,

        behavior:
            "smooth"

    });

}

/* =========================================================
   INICIAR
========================================================= */

loadResources();

loadNews();
