<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Curso de Português</title>

    <meta
        name="description"
        content="Recursos e materiais do Curso de Português"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {

            --background: #f7f7f5;

            --surface: #ffffff;

            --text: #181818;

            --muted: #777777;

            --border: #e8e8e8;

            --accent: #087f5b;

            --accent-dark: #056044;

            --shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.06);

            --radius: 18px;

        }

        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                var(--background);

            color:
                var(--text);

            line-height:
                1.5;

        }

        button,
        input {

            font: inherit;

        }

        a {

            color:
                inherit;

            text-decoration:
                none;

        }

        /* =====================================================
           HEADER
        ===================================================== */

        header {

            position:
                sticky;

            top:
                0;

            z-index:
                100;

            background:
                rgba(255,255,255,0.92);

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);

            border-bottom:
                1px solid var(--border);

        }

        .header-inner {

            max-width:
                1150px;

            margin:
                auto;

            padding:
                16px 22px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;

        }

        .brand {

            font-size:
                18px;

            font-weight:
                700;

            letter-spacing:
                -0.3px;

        }

        .brand span {

            color:
                var(--accent);

        }

        /* =====================================================
           MAIN
        ===================================================== */

        main {

            max-width:
                1150px;

            margin:
                auto;

            padding:
                35px 22px 70px;

        }

        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            position:
                relative;

            overflow:
                hidden;

            min-height:
                370px;

            border-radius:
                28px;

            background:
                #222;

            display:
                flex;

            align-items:
                flex-end;

            box-shadow:
                var(--shadow);

        }

        .hero-image {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

        }

        .hero-overlay {

            position:
                absolute;

            inset:
                0;

            background:
                linear-gradient(
                    to top,
                    rgba(0,0,0,0.72),
                    rgba(0,0,0,0.12) 70%
                );

        }

        .hero-content {

            position:
                relative;

            z-index:
                2;

            padding:
                40px;

            color:
                white;

        }

        .hero-content h1 {

            font-size:
                clamp(34px, 6vw, 58px);

            line-height:
                1;

            letter-spacing:
                -2px;

            margin-bottom:
                14px;

        }

        .hero-content p {

            font-size:
                17px;

            max-width:
                550px;

            color:
                rgba(255,255,255,0.88);

        }

        /* =====================================================
           SECTIONS
        ===================================================== */

        section {

            margin-top:
                55px;

        }

        .section-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                end;

            gap:
                20px;

            margin-bottom:
                22px;

        }

        .section-title {

            font-size:
                27px;

            letter-spacing:
                -0.7px;

        }

        .section-subtitle {

            color:
                var(--muted);

            font-size:
                14px;

            margin-top:
                4px;

        }

        /* =====================================================
           SEARCH
        ===================================================== */

        .search-box {

            position:
                relative;

            margin-bottom:
                25px;

        }

        .search-box input {

            width:
                100%;

            padding:
                15px 18px 15px 48px;

            border:
                1px solid var(--border);

            border-radius:
                14px;

            background:
                var(--surface);

            outline:
                none;

            transition:
                0.2s;

        }

        .search-box input:focus {

            border-color:
                var(--accent);

            box-shadow:
                0 0 0 3px
                rgba(8,127,91,0.08);

        }

        .search-icon {

            position:
                absolute;

            left:
                18px;

            top:
                50%;

            transform:
                translateY(-50%);

            color:
                var(--muted);

        }

        /* =====================================================
           NEWS
        ===================================================== */

        .news-wrapper {

            position:
                relative;

        }

        .news-container {

            display:
                flex;

            gap:
                16px;

            overflow-x:
                auto;

            scroll-behavior:
                smooth;

            scrollbar-width:
                none;

            padding:
                5px 2px 15px;

        }

        .news-container::-webkit-scrollbar {

            display:
                none;

        }

        /*
            TARJETA COMPACTA DE NOTICIA

            Ahora solamente muestra:
            - fecha
            - título

            El contenido completo aparece
            al abrir la noticia.
        */

        .news-card {

            flex:
                0 0 min(360px, 85vw);

            background:
                var(--surface);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            padding:
                24px;

            box-shadow:
                var(--shadow);

            min-height:
                155px;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

            cursor:
                pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                border-color 0.2s;

        }

        .news-card:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 35px
                rgba(0,0,0,0.09);

            border-color:
                rgba(8,127,91,0.25);

        }

        .news-card:active {

            transform:
                scale(0.985);

        }

        .news-date {

            color:
                var(--accent);

            font-size:
                12px;

            font-weight:
                700;

            letter-spacing:
                0.7px;

            margin-bottom:
                12px;

        }

        .news-title {

            font-size:
                21px;

            line-height:
                1.25;

            letter-spacing:
                -0.4px;

            overflow-wrap:
                anywhere;

        }

        /*
            Indicador visual discreto de que
            a notícia pode ser aberta.
        */

        .news-open-hint {

            margin-top:
                14px;

            font-size:
                12px;

            color:
                var(--muted);

        }

        .news-controls {

            display:
                flex;

            gap:
                8px;

            margin-top:
                12px;

        }

        .circle-button {

            width:
                40px;

            height:
                40px;

            border-radius:
                50%;

            border:
                1px solid var(--border);

            background:
                white;

            cursor:
                pointer;

            transition:
                0.2s;

        }

        .circle-button:hover {

            background:
                var(--accent);

            color:
                white;

            border-color:
                var(--accent);

        }

        /* =====================================================
           MODAL DA NOTÍCIA
        ===================================================== */

        .news-modal {

            position:
                fixed;

            inset:
                0;

            z-index:
                1000;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

            background:
                rgba(0,0,0,0.55);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            opacity:
                0;

            visibility:
                hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

        }

        .news-modal.active {

            opacity:
                1;

            visibility:
                visible;

        }

        .news-modal-content {

            position:
                relative;

            width:
                min(700px, 100%);

            max-height:
                min(80vh, 750px);

            overflow-y:
                auto;

            background:
                var(--surface);

            border-radius:
                24px;

            padding:
                35px;

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.25);

            transform:
                translateY(20px)
                scale(0.98);

            transition:
                transform 0.25s ease;

        }

        .news-modal.active
        .news-modal-content {

            transform:
                translateY(0)
                scale(1);

        }

        .news-modal-close {

            position:
                absolute;

            top:
                16px;

            right:
                16px;

            width:
                40px;

            height:
                40px;

            border-radius:
                50%;

            border:
                1px solid var(--border);

            background:
                #f7f7f5;

            color:
                var(--text);

            font-size:
                25px;

            line-height:
                1;

            cursor:
                pointer;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            transition:
                0.2s;

        }

        .news-modal-close:hover {

            background:
                var(--accent);

            color:
                white;

            border-color:
                var(--accent);

        }

        .modal-news-date {

            color:
                var(--accent);

            font-size:
                13px;

            font-weight:
                700;

            letter-spacing:
                0.8px;

            margin-bottom:
                10px;

        }

        .modal-news-title {

            font-size:
                clamp(27px, 5vw, 40px);

            line-height:
                1.12;

            letter-spacing:
                -1px;

            padding-right:
                45px;

            margin-bottom:
                25px;

        }

        .modal-news-divider {

            height:
                1px;

            background:
                var(--border);

            margin-bottom:
                25px;

        }

        .modal-news-body {

            color:
                #444;

            font-size:
                16px;

            line-height:
                1.75;

            white-space:
                pre-line;

            overflow-wrap:
                anywhere;

        }

        /* =====================================================
           FILTERS
        ===================================================== */

        .filters {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                9px;

            margin-bottom:
                24px;

        }

        .filter-button {

            border:
                1px solid var(--border);

            background:
                var(--surface);

            padding:
                10px 8px;

            min-height:
                46px;

            border-radius:
                999px;

            cursor:
                pointer;

            color:
                #555;

            transition:
                0.2s;

            white-space:
                nowrap;

            text-align:
                center;

        }

        .filter-button:hover,
        .filter-button.active {

            background:
                var(--accent);

            border-color:
                var(--accent);

            color:
                white;

        }

        /* =====================================================
           RESOURCE GRID
        ===================================================== */

        .resource-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(240px, 1fr)
                );

            gap:
                17px;

        }

        .resource-card {

            background:
                var(--surface);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            overflow:
                hidden;

            transition:
                transform 0.2s,
                box-shadow 0.2s;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.03);

        }

        .resource-card:hover {

            transform:
                translateY(-3px);

            box-shadow:
                var(--shadow);

        }

        .resource-preview {

            height:
                145px;

            background:
                #f1f1ef;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

        }

        .resource-preview img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            cursor:
                pointer;

        }

        .resource-preview video {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

        }

        .resource-icon {

            font-size:
                43px;

        }

        .resource-content {

            padding:
                18px;

        }

        .resource-type {

            font-size:
                11px;

            color:
                var(--accent);

            font-weight:
                700;

            text-transform:
                uppercase;

            letter-spacing:
                0.7px;

            margin-bottom:
                5px;

        }

        .resource-name {

            font-size:
                17px;

            font-weight:
                650;

            overflow-wrap:
                anywhere;

            margin-bottom:
                15px;

        }

        .resource-actions {

            display:
                flex;

            gap:
                8px;

        }

        .resource-button {

            flex:
                1;

            border:
                1px solid var(--border);

            background:
                white;

            padding:
                9px 10px;

            border-radius:
                10px;

            cursor:
                pointer;

            text-align:
                center;

            font-size:
                13px;

            transition:
                0.2s;

        }

        .resource-button.primary {

            background:
                var(--accent);

            color:
                white;

            border-color:
                var(--accent);

        }

        .resource-button:hover {

            opacity:
                0.86;

        }

        /* =====================================================
           AUDIO / MÚSICA
        ===================================================== */

        .audio-preview {

            width:
                100%;

            padding:
                18px;

        }

        .audio-icon {

            text-align:
                center;

            font-size:
                38px;

            margin-bottom:
                12px;

        }

        .audio-preview audio {

            width:
                100%;

        }

        /* =====================================================
           EMPTY / LOADING
        ===================================================== */

        .message {

            padding:
                35px 20px;

            text-align:
                center;

            color:
                var(--muted);

            background:
                var(--surface);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

        }

        .loading {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                10px;

        }

        .spinner {

            width:
                18px;

            height:
                18px;

            border:
                2px solid #ddd;

            border-top-color:
                var(--accent);

            border-radius:
                50%;

            animation:
                spin 0.7s linear infinite;

        }

        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }

        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            border-top:
                1px solid var(--border);

            background:
                white;

            text-align:
                center;

            padding:
                25px 20px;

            color:
                var(--muted);

            font-size:
                13px;

        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 600px) {

            main {

                padding:
                    20px 14px 50px;

            }

            .hero {

                min-height:
                    330px;

                border-radius:
                    22px;

            }

            .hero-content {

                padding:
                    25px;

            }

            .hero-content h1 {

                letter-spacing:
                    -1.5px;

            }

            section {

                margin-top:
                    40px;

            }

            .section-title {

                font-size:
                    24px;

            }

            /*
                EXATAMENTE 3 FILTROS POR LINHA
            */

            .filters {

                grid-template-columns:
                    repeat(3, 1fr);

                gap:
                    8px;

            }

            .filter-button {

                padding:
                    9px 5px;

                font-size:
                    13px;

                min-width:
                    0;

            }

            .resource-grid {

                grid-template-columns:
                    1fr;

            }

            .resource-preview {

                height:
                    170px;

            }

            /*
                NOTÍCIAS
            */

            .news-card {

                flex-basis:
                    86vw;

                min-height:
                    135px;

                padding:
                    20px;

            }

            .news-title {

                font-size:
                    19px;

            }

            .news-open-hint {

                margin-top:
                    10px;

            }

            /*
                MODAL
            */

            .news-modal {

                padding:
                    12px;

                align-items:
                    flex-end;

            }

            .news-modal-content {

                max-height:
                    88vh;

                border-radius:
                    22px;

                padding:
                    28px 22px 30px;

            }

            .news-modal-close {

                top:
                    12px;

                right:
                    12px;

            }

            .modal-news-title {

                font-size:
                    28px;

                padding-right:
                    40px;

            }

            .modal-news-body {

                font-size:
                    15px;

                line-height:
                    1.7;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <div class="header-inner">

        <div class="brand">

            Curso de
            <span>Português</span>

        </div>

    </div>

</header>


<main>


<!-- =========================================================
     CAPA
========================================================= -->

<div class="hero">

    <img
        class="hero-image"
        src="recursos/portada/IMG_3317.jpeg"
        alt="Capa do Curso de Português"
        onerror="this.style.display='none';"
    >

    <div class="hero-overlay"></div>

    <div class="hero-content">

        <h1>
            Curso de Português
        </h1>

        <p>
            Recursos e materiais para acompanhar

        </p>

    </div>

</div>


<!-- =========================================================
     NOTÍCIAS
========================================================= -->

<section id="noticias">

    <div class="section-header">

        <div>

            <h2 class="section-title">
                Notícias recentes
            </h2>

            <p class="section-subtitle">
                Novidades e avisos do curso
            </p>

        </div>


        <div class="news-controls">

            <button
                class="circle-button"
                onclick="scrollNews(-1)"
                aria-label="Notícias anteriores"
            >

            </button>

            <button
                class="circle-button"
                onclick="scrollNews(1)"
                aria-label="Próximas notícias"

    <div

        class="news-container"
    >

            <div class="loading">

            </div>

        </div>

    </div>

</section>


<!-- =========================================================
     RECURSOS
========================================================= -->

<section id="recursos">

    <div class="section-header">

        <div>

            <h2 class="section-title">
                Recursos do curso
            </h2>

            <p
                id="resourceCounter"
                class="section-subtitle"
            >
                Carregando recursos...
            </p>

        </div>

    </div>


    <div class="search-box">

        <span class="search-icon">
            🔍
        </span>

        <input
            id="searchInput"
            type="search"
            placeholder="Buscar recursos..."
            autocomplete="off"
        >

    </div>


    <div
        id="filters"
        class="filters"
    ></div>


    <div
        id="resourceGrid"
        class="resource-grid"
    >

        <div class="message">

            <div class="loading">

                <div class="spinner"></div>

                Carregando recursos...

            </div>

        </div>

    </div>

</section>


</main>


<!-- =========================================================
     MODAL DA NOTÍCIA
========================================================= -->

<div
    id="newsModal"
    class="news-modal"
    aria-hidden="true"
>

    <div
        class="news-modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalNewsTitle"
    >

        <button
            id="newsModalClose"
            class="news-modal-close"
            type="button"
            aria-label="Fechar notícia"
        >
            ×
        </button>


        <div
            id="modalNewsDate"
            class="modal-news-date"
        ></div>


        <h2
            id="modalNewsTitle"
            class="modal-news-title"
        ></h2>


        <div
            class="modal-news-divider"
        ></div>


        <div
            id="modalNewsBody"
            class="modal-news-body"
        ></div>

    </div>

</div>


<!-- =========================================================
     FOOTER
========================================================= -->

<footer>

    Curso de Português · Recursos educativos

</footer>


<script>


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const GITHUB_USER =
    "iamgeolh";

const GITHUB_REPO =
    "curso-de-portugues";

const GITHUB_BRANCH =
    "main";


/*
    ESTRUTURA:

    recursos/
    ├── portada/
    ├── imagenes/
    ├── pdf/
    ├── audio/
    ├── musica/
    └── video/

    A pasta portada não é considerada
    um recurso.
*/


const RESOURCE_FOLDERS = {

    "Imagens":
        "recursos/imagenes",

    "Documentos":
        "recursos/pdf",

    "Áudio":
        "recursos/audio",

    "Música":
        "recursos/musica",

    "Vídeo":
        "recursos/video"

};


const NEWS_FOLDER =
    "noticias";


/* =========================================================
   VARIÁVEIS
========================================================= */

let allResources = [];

let currentFilter =
    "Todos";

let currentSearch =
    "";


/*
    Armazena todas as notícias
    para poder abrir uma notícia
    específica no modal.
*/

let allNews = [];


/* =========================================================
   API DO GITHUB
========================================================= */

async function githubContents(path) {

    const url =
        `https://api.github.com/repos/` +
        `${GITHUB_USER}/` +
        `${GITHUB_REPO}/contents/` +
        `${path}?ref=${GITHUB_BRANCH}`;

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            `Não foi possível acessar ${path}`
        );

    }

    return await response.json();

}


/* =========================================================
   ARQUIVOS DE UMA PASTA
========================================================= */

async function getFilesFromFolder(path) {

    const items =
        await githubContents(path);

    return items.filter(
        item =>
            item.type === "file"
    );

}


/* =========================================================
   TIPO DE ARQUIVO
========================================================= */

function getFileType(filename) {

    const extension =
        filename
            .split(".")
            .pop()
            .toLowerCase();


    if (
        extension === "pdf"
    ) {

        return "Documentos";

    }


    if (
        [
            "jpg",
            "jpeg",
            "png",
            "gif",
            "webp",
            "svg"
        ].includes(extension)
    ) {

        return "Imagens";

    }


    if (
        [
            "mp3",
            "wav",
            "ogg",
            "m4a",
            "aac"
        ].includes(extension)
    ) {

        return "Áudio";

    }


    if (
        [
            "mp4",
            "webm",
            "mov",
            "m4v",
            "avi"
        ].includes(extension)
    ) {

        return "Vídeo";

    }


    return null;

}


/* =========================================================
   NOME BONITO
========================================================= */

function prettyName(filename) {

    let name =
        filename
            .split("/")
            .pop();


    name =
        name.replace(
            /\.[^/.]+$/,
            ""
        );


    name =
        name.replace(
            /[-_]+/g,
            " "
        );


    name =
        name.replace(
            /\b\w/g,
            letter =>
                letter.toUpperCase()
        );


    return name;

}


/* =========================================================
   ÍCONES
========================================================= */

function getIcon(type) {

    switch (type) {

        case "Documentos":
            return "📄";

        case "Imagens":
            return "🖼️";

        case "Áudio":
            return "🎧";

        case "Música":
            return "🎵";

        case "Vídeo":
            return "🎬";

        default:
            return "📁";

    }

}


/* =========================================================
   NOME VISÍVEL DO TIPO
========================================================= */

function getDisplayType(type) {

    switch (type) {

        case "Documentos":
            return "Docs";

        case "Imagens":
            return "Imagens";

        case "Áudio":
            return "Áudio";

        case "Música":
            return "Música";

        case "Vídeo":
            return "Vídeo";

        default:
            return type;

    }

}


/* =========================================================
   CARREGAR RECURSOS
========================================================= */

async function loadResources() {

    const grid =
        document.getElementById(
            "resourceGrid"
        );


    try {

        const folderEntries =
            Object.entries(
                RESOURCE_FOLDERS
            );


        const results =
            await Promise.all(

                folderEntries.map(

                    async ([type, folder]) => {

                        const files =
                            await getFilesFromFolder(
                                folder
                            );


                        return files

                            .map(file => {

                                const detectedType =
                                    getFileType(
                                        file.name
                                    );


                                if (
                                    type === "Áudio"
                                ) {

                                    if (
                                        detectedType !==
                                        "Áudio"
                                    ) {

                                        return null;

                                    }

                                }


                                if (
                                    type === "Vídeo"
                                ) {

                                    if (
                                        detectedType !==
                                        "Vídeo"
                                    ) {

                                        return null;

                                    }

                                }


                                if (
                                    type === "Imagens"
                                ) {

                                    if (
                                        detectedType !==
                                        "Imagens"
                                    ) {

                                        return null;

                                    }

                                }


                                if (
                                    type === "Documentos"
                                ) {

                                    if (
                                        detectedType !==
                                        "Documentos"
                                    ) {

                                        return null;

                                    }

                                }


                                if (
                                    type === "Música"
                                ) {

                                    const extension =
                                        file.name
                                            .split(".")
                                            .pop()
                                            .toLowerCase();


                                    if (
                                        ![
                                            "mp3",
                                            "wav",
                                            "ogg",
                                            "m4a",
                                            "aac"
                                        ].includes(
                                            extension
                                        )
                                    ) {

                                        return null;

                                    }

                                }


                                return {

                                    name:
                                        prettyName(
                                            file.name
                                        ),

                                    type:
                                        type,

                                    url:
                                        file.html_url,

                                    rawUrl:
                                        file.download_url,

                                    path:
                                        file.path,

                                    filename:
                                        file.name

                                };

                            })

                            .filter(Boolean);

                    }

                )

            );


        allResources =
            results.flat();


        allResources.sort(

            (a, b) =>
                a.name.localeCompare(
                    b.name,
                    "pt",
                    {
                        sensitivity:
                            "base"
                    }
                )

        );


        createFilters();

        renderResources();

    }


    catch (error) {

        console.error(
            "Erro ao carregar recursos:",
            error
        );


        grid.innerHTML = `

            <div class="message">

                Não foi possível carregar os recursos.

                <br><br>

                Verifique se o repositório do GitHub
                é público e se os dados de configuração
                estão corretos.

            </div>

        `;


        document.getElementById(
            "resourceCounter"
        ).textContent =
            "Não foi possível carregar os recursos.";

    }

}


/* =========================================================
   FILTROS
========================================================= */

function createFilters() {

    const container =
        document.getElementById(
            "filters"
        );


    const types = [

        "Todos",

        "Documentos",

        "Imagens",

        "Áudio",

        "Música",

        "Vídeo"

    ];


    container.innerHTML =
        "";


    types.forEach(type => {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "filter-button" +
            (
                type === "Todos"
                    ? " active"
                    : ""
            );


        let visibleName;


        if (
            type === "Todos"
        ) {

            visibleName =
                "Todos";

        }

        else {

            visibleName =
                getDisplayType(
                    type
                );

        }


        button.textContent =
            `${getIcon(type)} ${visibleName}`;


        button.onclick = () => {

            currentFilter =
                type;


            document
                .querySelectorAll(
                    ".filter-button"
                )
                .forEach(btn =>
                    btn.classList.remove(
                        "active"
                    )
                );


            button.classList.add(
                "active"
            );


            renderResources();

        };


        container.appendChild(
            button
        );

    });

}


/* =========================================================
   MOSTRAR RECURSOS
========================================================= */

function renderResources() {

    const grid =
        document.getElementById(
            "resourceGrid"
        );


    let resources =
        [...allResources];


    if (
        currentFilter !== "Todos"
    ) {

        resources =
            resources.filter(
                resource =>
                    resource.type ===
                    currentFilter
            );

    }


    if (
        currentSearch.trim() !== ""
    ) {

        const search =
            currentSearch
                .toLowerCase()
                .trim();


        resources =
            resources.filter(
                resource =>
                    resource.name
                        .toLowerCase()
                        .includes(search)
            );

    }


    document.getElementById(
        "resourceCounter"
    ).textContent =

        `${resources.length} recurso` +

        `${
            resources.length === 1
                ? ""
                : "s"
        }`;


    if (
        resources.length === 0
    ) {

        grid.innerHTML = `

            <div class="message">

                Nenhum recurso encontrado.

            </div>

        `;

        return;

    }


    grid.innerHTML =
        "";


    resources.forEach(
        resource => {

            const card =
                createResourceCard(
                    resource
                );


            grid.appendChild(
                card
            );

        }
    );

}

/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================================================
   ESCAPAR ATRIBUTOS
========================================================= */

function escapeAttribute(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}

async function loadNews() {

    const container =
        document.getElementById(
            "newsContainer"
        );


    try {

        const files =
            await getFilesRecursively(
                NEWS_FOLDER
            );


        const textFiles =
            files.filter(
                file => {

                    const extension =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    return (
                        extension ===
                        "txt"
                    );

                }
            );


        /*
            Criamos todas as notícias
            antes de ordenar.
        */

        const loadedNews =
            [];


        for (
            const file
            of textFiles
        ) {

            try {

                const rawUrl =
                    `https://raw.githubusercontent.com/` +
                    `${GITHUB_USER}/` +
                    `${GITHUB_REPO}/` +
                    `${GITHUB_BRANCH}/` +
                    `${file.path}`;


                const response =
                    await fetch(
                        rawUrl
                    );


                if (
                    !response.ok
                ) {

                    continue;

                }


                const text =
                    await response.text();


                const news =
                    parseNews(
                        text,
                        file.name
                    );


                /*
                    Guardamos também o
                    caminho do arquivo.
                */

                loadedNews.push({

                    ...news,

                    path:
                        file.path,

                    filename:
                        file.name,

                    rawUrl:
                        rawUrl

                });

            }

            catch (error) {

                console.error(
                    "Erro ao ler notícia:",
                    file.name,
                    error
                );

            }

        }


        /*
            =================================================
            ORDENAR POR DATA
            =================================================

            A data é interpretada como:

            DD/MM/AAAA

            Exemplo:

            16/09/2026

            As notícias mais recentes
            aparecem primeiro.
        */

        loadedNews.sort(
            (a, b) => {

                const dateA =
                    parseDateForSort(
                        a.date
                    );


                const dateB =
                    parseDateForSort(
                        b.date
                    );


                /*
                    Se ambas tiverem
                    datas válidas.
                */

                if (
                    dateA !== null &&
                    dateB !== null
                ) {

                    return dateB - dateA;

                }


                /*
                    Se apenas A tiver
                    data válida.
                */

                if (
                    dateA !== null
                ) {

                    return -1;

                }


                /*
                    Se apenas B tiver
                    data válida.
                */

                if (
                    dateB !== null
                ) {

                    return 1;

                }


                /*
                    Se nenhuma tiver data,
                    usamos o nome do arquivo.
                */

                return b.filename.localeCompare(
                    a.filename
                );

            }
        );


        allNews =
            loadedNews;


        /*
            Nenhuma notícia
        */

        if (
            allNews.length === 0
        ) {

            container.innerHTML = `

                <div class="message">

                    Não há notícias disponíveis.

                </div>

            `;

            return;

        }


        container.innerHTML =
            "";


        /*
            Criar cartões compactos.
        */

        allNews.forEach(
            (news, index) => {

                const card =
                    createNewsCard(
                        news,
                        index
                    );


                container.appendChild(
                    card
                );

            }
        );

    }


    catch (error) {

        console.error(
            "Erro ao carregar notícias:",
            error
        );


        container.innerHTML = `

            <div class="message">

                Não foi possível carregar as notícias.

            </div>

        `;

    }

}

/* =========================================================
   INTERPRETAR DATA DD/MM/AAAA
========================================================= */

function parseDateForSort(
    dateString
) {

    if (
        !dateString
    ) {

        return null;

    }


    /*
        Aceita:

        16/09/2026

        e também:

        16-09-2026
    */

    const match =
        dateString
            .trim()
            .match(
                /^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/
            );


    if (
        !match
    ) {

        return null;

    }


    const day =
        Number(
            match[1]
        );


    const month =
        Number(
            match[2]
        );


    const year =
        Number(
            match[3]
        );


    /*
        Validação básica
    */

    if (
        month < 1 ||
        month > 12 ||
        day < 1 ||
        day > 31
    ) {

        return null;

    }


    const date =
        new Date(
            year,
            month - 1,
            day
        );


    /*
        Evita datas como
        31/02/2026.
    */

    if (
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
    ) {

        return null;

    }


    return date.getTime();

}

/* =========================================================
   FUNÇÃO PARA NOTÍCIAS RECURSIVAS
========================================================= */

async function getFilesRecursively(
    path
) {

    const items =
        await githubContents(
            path
        );


    let files =
        [];


    for (
        const item
        of items
    ) {

        if (
            item.type ===
            "file"
        ) {

            files.push(
                item
            );

        }


        else if (
            item.type ===
            "dir"
        ) {

            const children =
                await getFilesRecursively(
                    item.path
                );


            files =
                files.concat(
                    children
                );

        }

    }


    return files;

}


/* =========================================================
   INTERPRETAR NOTÍCIA TXT
========================================================= */

/*
    FORMATO ESPERADO:

    LINHA 1:
    Título da notícia

    LINHA 2:
    16/09/2026

    LINHA 3 EM DIANTE:
    Conteúdo completo da notícia.

    Exemplo:

    Horário do Curso de Português
    16/09/2026
    Informamos aos alunos que o Curso de Português...
    As aulas serão realizadas...
    etc.
*/

function parseNews(
    text,
    filename
) {

    const lines =
        text.split(
            /\r?\n/
        );


    /*
        Título padrão caso
        a primeira linha esteja vazia.
    */

    let title =
        prettyName(
            filename
        );


    let date =
        "";


    let content =
        "";


    /*
        PRIMEIRA LINHA = TÍTULO
    */

    if (
        lines.length > 0 &&
        lines[0].trim() !== ""
    ) {

        title =
            lines[0].trim();

    }


    /*
        SEGUNDA LINHA = DATA
    */

    if (
        lines.length > 1
    ) {

        date =
            lines[1].trim();

    }


    /*
        TERCEIRA LINHA EM DIANTE
        = CONTEÚDO
    */

    if (
        lines.length > 2
    ) {

        content =
            lines
                .slice(2)
                .join("\n")
                .trim();

    }


    return {

        title:
            title,

        date:
            date,

        content:
            content

    };

}

        left:

        behavior:
            "smooth"

    });

}
