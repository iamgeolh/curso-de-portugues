<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Curso de Português</title>

    <meta
        name="description"
        content="Recursos e materiais do Curso de Português"
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {

            --background: #f7f7f5;

            --surface: #ffffff;

            --text: #181818;

            --muted: #777777;

            --border: #e8e8e8;

            --accent: #087f5b;

            --accent-dark: #056044;

            --shadow:
                0 8px 30px rgba(0, 0, 0, 0.06);

            --radius: 18px;

        }

        html {
            scroll-behavior: smooth;
        }

        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                var(--background);

            color:
                var(--text);

            line-height:
                1.5;

        }

        body.modal-open {
            overflow: hidden;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            position: sticky;

            top: 0;

            z-index: 100;

            background:
                rgba(255, 255, 255, 0.92);

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);

            border-bottom:
                1px solid var(--border);

        }

        .header-inner {

            max-width:
                1150px;

            margin:
                auto;

            padding:
                16px 22px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;

        }

        .brand {

            font-size:
                18px;

            font-weight:
                700;

            letter-spacing:
                -0.3px;

        }

        .brand span {
            color:
                var(--accent);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {

            max-width:
                1150px;

            margin:
                auto;

            padding:
                35px 22px 70px;

        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            position:
                relative;

            overflow:
                hidden;

            min-height:
                370px;

            border-radius:
                28px;

            background:
                #222;

            display:
                flex;

            align-items:
                flex-end;

            box-shadow:
                var(--shadow);

        }

        .hero-image {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

        }

        .hero-overlay {

            position:
                absolute;

            inset:
                0;

            background:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.72),
                    rgba(0, 0, 0, 0.12) 70%
                );

        }

        .hero-content {

            position:
                relative;

            z-index:
                2;

            padding:
                40px;

            color:
                white;

        }

        .hero-content h1 {

            font-size:
                clamp(34px, 6vw, 58px);

            line-height:
                1;

            letter-spacing:
                -2px;

            margin-bottom:
                14px;

        }

        .hero-content p {

            font-size:
                17px;

            max-width:
                550px;

            color:
                rgba(255,255,255,0.88);

        }


        /* =====================================================
           SECTIONS
        ===================================================== */

        section {
            margin-top:
                55px;
        }

        .section-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                end;

            gap:
                20px;

            margin-bottom:
                22px;

        }

        .section-title {

            font-size:
                27px;

            letter-spacing:
                -0.7px;

        }

        .section-subtitle {

            color:
                var(--muted);

            font-size:
                14px;

            margin-top:
                4px;

        }


        /* =====================================================
           SEARCH
        ===================================================== */

        .search-box {

            position:
                relative;

            margin-bottom:
                25px;

        }

        .search-box input {

            width:
                100%;

            padding:
                15px 18px 15px 48px;

            border:
                1px solid var(--border);

            border-radius:
                14px;

            background:
                var(--surface);

            outline:
                none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;

        }

        .search-box input:focus {

            border-color:
                var(--accent);

            box-shadow:
                0 0 0 3px
                rgba(8, 127, 91, 0.08);

        }

        .search-icon {

            position:
                absolute;

            left:
                18px;

            top:
                50%;

            transform:
                translateY(-50%);

            color:
                var(--muted);

            pointer-events:
                none;

        }


        /* =====================================================
           NEWS CAROUSEL
        ===================================================== */

        .news-wrapper {
            position:
                relative;
        }

        .news-container {

            display:
                flex;

            gap:
                16px;

            overflow-x:
                auto;

            scroll-behavior:
                smooth;

            scrollbar-width:
                none;

            padding:
                5px 2px 15px;

        }

        .news-container::-webkit-scrollbar {
            display:
                none;
        }


        /* =====================================================
           NEWS CARD
        ===================================================== */

        .news-card {

            flex:
                0 0 min(360px, 85vw);

            background:
                var(--surface);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            padding:
                22px;

            box-shadow:
                var(--shadow);

            display:
                flex;

            flex-direction:
                column;

            min-height:
                150px;

            cursor:
                pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                border-color 0.2s;

            user-select:
                none;

        }

        .news-card:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 35px
                rgba(0,0,0,0.08);

            border-color:
                #dcdcdc;

        }

        .news-card:active {

            transform:
                scale(0.985);

        }

        .news-date {

            color:
                var(--accent);

            font-size:
                12px;

            font-weight:
                700;

            letter-spacing:
                0.7px;

            margin-bottom:
                9px;

        }

        .news-title {

            font-size:
                20px;

            line-height:
                1.25;

            display:
                -webkit-box;

            -webkit-line-clamp:
                2;

            -webkit-box-orient:
                vertical;

            overflow:
                hidden;

        }

        /*
            Texto da notícia NÃO aparece
            no cartão compacto.
        */

        .news-text {
            display:
                none;
        }


        /* =====================================================
           NEWS CONTROLS
        ===================================================== */

        .news-controls {

            display:
                flex;

            gap:
                8px;

            margin-top:
                12px;

        }

        .circle-button {

            width:
                40px;

            height:
                40px;

            border-radius:
                50%;

            border:
                1px solid var(--border);

            background:
                white;

            cursor:
                pointer;

            transition:
                0.2s;

            flex-shrink:
                0;

        }

        .circle-button:hover {

            background:
                var(--accent);

            color:
                white;

            border-color:
                var(--accent);

        }


        /* =====================================================
           NEWS MODAL
        ===================================================== */

        .news-modal {

            position:
                fixed;

            inset:
                0;

            z-index:
                1000;

            background:
                rgba(0,0,0,0.48);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

            opacity:
                0;

            visibility:
                hidden;

            pointer-events:
                none;

            transition:
                opacity 0.22s ease,
                visibility 0.22s ease;

        }

        .news-modal.active {

            opacity:
                1;

            visibility:
                visible;

            pointer-events:
                auto;

        }

        .news-modal-content {

            width:
                min(720px, 100%);

            max-height:
                min(85vh, 850px);

            background:
                var(--surface);

            border-radius:
                24px;

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.2);

            overflow:
                hidden;

            display:
                flex;

            flex-direction:
                column;

            transform:
                translateY(18px)
                scale(0.98);

            transition:
                transform 0.22s ease;

        }

        .news-modal.active
        .news-modal-content {

            transform:
                translateY(0)
                scale(1);

        }

        .news-modal-header {

            padding:
                22px 22px 16px;

            border-bottom:
                1px solid var(--border);

            display:
                flex;

            align-items:
                flex-start;

            justify-content:
                space-between;

            gap:
                18px;

        }

        .news-modal-date {

            color:
                var(--accent);

            font-size:
                12px;

            font-weight:
                700;

            letter-spacing:
                0.7px;

            margin-bottom:
                8px;

        }

        .news-modal-title {

            font-size:
                clamp(24px, 5vw, 34px);

            line-height:
                1.12;

            letter-spacing:
                -0.8px;

        }

        .news-close {

            width:
                40px;

            height:
                40px;

            flex-shrink:
                0;

            border:
                1px solid var(--border);

            background:
                #f7f7f5;

            border-radius:
                50%;

            font-size:
                22px;

            line-height:
                1;

            cursor:
                pointer;

            transition:
                0.2s;

        }

        .news-close:hover {

            background:
                var(--accent);

            border-color:
                var(--accent);

            color:
                white;

        }

        .news-modal-body {

            padding:
                22px;

            overflow-y:
                auto;

            -webkit-overflow-scrolling:
                touch;

        }

        .news-modal-text {

            color:
                #383838;

            font-size:
                17px;

            line-height:
                1.75;

            white-space:
                pre-line;

            overflow-wrap:
                anywhere;

        }


        /* =====================================================
           RESOURCE FILTERS
        ===================================================== */

        .filters {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                9px;

            margin-bottom:
                24px;

        }

        .filter-button {

            border:
                1px solid var(--border);

            background:
                var(--surface);

            padding:
                10px 8px;

            min-height:
                46px;

            border-radius:
                999px;

            cursor:
                pointer;

            color:
                #555;

            transition:
                0.2s;

            white-space:
                nowrap;

            text-align:
                center;

        }

        .filter-button:hover,
        .filter-button.active {

            background:
                var(--accent);

            border-color:
                var(--accent);

            color:
                white;

        }


        /* =====================================================
           RESOURCE GRID
        ===================================================== */

        .resource-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(240px, 1fr)
                );

            gap:
                17px;

        }

        .resource-card {

            background:
                var(--surface);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            overflow:
                hidden;

            transition:
                transform 0.2s,
                box-shadow 0.2s;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.03);

        }

        .resource-card:hover {

            transform:
                translateY(-3px);

            box-shadow:
                var(--shadow);

        }


        /* =====================================================
           RESOURCE PREVIEW
        ===================================================== */

        .resource-preview {

            height:
                145px;

            background:
                #f1f1ef;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

        }

        .resource-preview img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            cursor:
                pointer;

        }

        .resource-preview video {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

        }

        .resource-icon {

            font-size:
                43px;

        }


        /* =====================================================
           RESOURCE CONTENT
        ===================================================== */

        .resource-content {

            padding:
                18px;

        }

        .resource-type {

            font-size:
                11px;

            color:
                var(--accent);

            font-weight:
                700;

            text-transform:
                uppercase;

            letter-spacing:
                0.7px;

            margin-bottom:
                5px;

        }

        .resource-name {

            font-size:
                17px;

            font-weight:
                650;

            overflow-wrap:
                anywhere;

            margin-bottom:
                15px;

        }

        .resource-actions {

            display:
                flex;

            gap:
                8px;

        }

        .resource-button {

            flex:
                1;

            border:
                1px solid var(--border);

            background:
                white;

            padding:
                9px 10px;

            border-radius:
                10px;

            cursor:
                pointer;

            text-align:
                center;

            font-size:
                13px;

            transition:
                0.2s;

        }

        .resource-button.primary {

            background:
                var(--accent);

            color:
                white;

            border-color:
                var(--accent);

        }

        .resource-button:hover {
            opacity:
                0.86;
        }


        /* =====================================================
           AUDIO / MÚSICA
        ===================================================== */

        .audio-preview {

            width:
                100%;

            padding:
                18px;

        }

        .audio-icon {

            text-align:
                center;

            font-size:
                38px;

            margin-bottom:
                12px;

        }

        .audio-preview audio {

            width:
                100%;

        }


        /* =====================================================
           EMPTY / LOADING
        ===================================================== */

        .message {

            padding:
                35px 20px;

            text-align:
                center;

            color:
                var(--muted);

            background:
                var(--surface);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

        }

        .loading {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                10px;

        }

        .spinner {

            width:
                18px;

            height:
                18px;

            border:
                2px solid #ddd;

            border-top-color:
                var(--accent);

            border-radius:
                50%;

            animation:
                spin 0.7s linear infinite;

        }

        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            border-top:
                1px solid var(--border);

            background:
                white;

            text-align:
                center;

            padding:
                25px 20px;

            color:
                var(--muted);

            font-size:
                13px;

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 600px) {

            main {

                padding:
                    20px 14px 50px;

            }

            .hero {

                min-height:
                    330px;

                border-radius:
                    22px;

            }

            .hero-content {

                padding:
                    25px;

            }

            .hero-content h1 {

                letter-spacing:
                    -1.5px;

            }

            section {

                margin-top:
                    40px;

            }

            .section-title {

                font-size:
                    24px;

            }

            /*
                Exatamente 3 filtros por linha:

                Todos | Docs | Imagens
                Áudio | Música | Vídeo
            */

            .filters {

                grid-template-columns:
                    repeat(3, 1fr);

                gap:
                    8px;

            }

            .filter-button {

                padding:
                    9px 5px;

                font-size:
                    14px;

                min-width:
                    0;

            }

            .resource-grid {

                grid-template-columns:
                    1fr;

            }

            .resource-preview {

                height:
                    170px;

            }

            .news-modal {

                padding:
                    10px;

                align-items:
                    flex-end;

            }

            .news-modal-content {

                max-height:
                    92vh;

                border-radius:
                    22px 22px 0 0;

            }

            .news-modal-header {

                padding:
                    20px 18px 15px;

            }

            .news-modal-body {

                padding:
                    18px;

            }

            .news-modal-text {

                font-size:
                    16px;

                line-height:
                    1.7;

            }

        }


        /* =====================================================
           REDUÇÃO DE MOVIMENTO
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                scroll-behavior:
                    auto !important;

                transition:
                    none !important;

                animation:
                    none !important;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <div class="header-inner">

        <div class="brand">

            Curso de
            <span>Português</span>

        </div>

    </div>

</header>


<main>


<!-- =========================================================
     CAPA
========================================================= -->

<div class="hero">

    <img
        class="hero-image"
        src="recursos/portada/IMG_3317.jpeg"
        alt="Capa do Curso de Português"
        onerror="this.style.display='none';"
    >

    <div class="hero-overlay"></div>

    <div class="hero-content">

        <h1>
            Curso de Português
        </h1>

        <p>
            Recursos e materiais para acompanhar
            o aprendizado da língua portuguesa.
        </p>

    </div>

</div>


<!-- =========================================================
     NOTÍCIAS
========================================================= -->

<section id="noticias">

    <div class="section-header">

        <div>

            <h2 class="section-title">
                Notícias recentes
            </h2>

            <p class="section-subtitle">
                Novidades e avisos do curso
            </p>

        </div>

        <div class="news-controls">

            <button
                class="circle-button"
                onclick="scrollNews(-1)"
                aria-label="Notícias anteriores"
            >
                ←
            </button>

            <button
                class="circle-button"
                onclick="scrollNews(1)"
                aria-label="Próximas notícias"
            >
                →
            </button>

        </div>

    </div>


    <div
        id="newsContainer"
        class="news-container"
    >

        <div class="message">

            <div class="loading">

                <div class="spinner"></div>

                Carregando notícias...

            </div>

        </div>

    </div>

</section>


<!-- =========================================================
     RECURSOS
========================================================= -->

<section id="recursos">

    <div class="section-header">

        <div>

            <h2 class="section-title">
                Recursos do curso
            </h2>

            <p
                id="resourceCounter"
                class="section-subtitle"
            >
                Carregando recursos...

            </p>

        </div>

    </div>


    <!-- BUSCA -->

    <div class="search-box">

        <span class="search-icon">
            🔍
        </span>

        <input
            id="searchInput"
            type="search"
            placeholder="Buscar recursos..."
            autocomplete="off"
            spellcheck="false"
        >

    </div>


    <!-- FILTROS -->

    <div
        id="filters"
        class="filters"
    ></div>


    <!-- RECURSOS -->

    <div
        id="resourceGrid"
        class="resource-grid"
    >

        <div class="message">

            <div class="loading">

                <div class="spinner"></div>

                Carregando recursos...

            </div>

        </div>

    </div>

</section>


</main>


<!-- =========================================================
     MODAL DE NOTÍCIA
========================================================= -->

<div
    id="newsModal"
    class="news-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="newsModalTitle"
>

    <div class="news-modal-content">

        <div class="news-modal-header">

            <div>

                <div
                    id="newsModalDate"
                    class="news-modal-date"
                ></div>

                <h2
                    id="newsModalTitle"
                    class="news-modal-title"
                ></h2>

            </div>

            <button
                id="newsClose"
                class="news-close"
                aria-label="Fechar notícia"
            >
                ×
            </button>

        </div>

        <div class="news-modal-body">

            <div
                id="newsModalText"
                class="news-modal-text"
            ></div>

        </div>

    </div>

</div>


<!-- =========================================================
     FOOTER
========================================================= -->

<footer>

    Curso de Português · Recursos educativos

</footer>


<script>


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const GITHUB_USER =
    "iamgeolh";

const GITHUB_REPO =
    "curso-de-portugues";

const GITHUB_BRANCH =
    "main";


/*
    ESTRUTURA DO REPOSITÓRIO

    recursos/
    ├── portada/
    ├── imagenes/
    ├── pdf/
    ├── audio/
    ├── musica/
    └── video/

    noticias/

    A pasta portada NÃO faz parte dos recursos.
*/


const RESOURCE_FOLDERS = {

    "Imagens":
        "recursos/imagenes",

    "Docs":
        "recursos/pdf",

    "Áudio":
        "recursos/audio",

    "Música":
        "recursos/musica",

    "Vídeo":
        "recursos/video"

};


const NEWS_FOLDER =
    "noticias";


/* =========================================================
   VARIÁVEIS
========================================================= */

let allResources = [];

let currentFilter =
    "Todos";

let currentSearch =
    "";

let searchFrame =
    null;


/* =========================================================
   API DO GITHUB
========================================================= */

async function githubContents(path) {

    const url =
        `https://api.github.com/repos/` +
        `${GITHUB_USER}/` +
        `${GITHUB_REPO}/contents/` +
        `${path}?ref=${GITHUB_BRANCH}`;

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            `Não foi possível acessar ${path}`
        );

    }

    return await response.json();

}


/* =========================================================
   OBTER ARQUIVOS DE UMA PASTA
========================================================= */

async function getFilesFromFolder(path) {

    const items =
        await githubContents(path);

    return items.filter(
        item =>
            item.type === "file"
    );

}


/* =========================================================
   TIPO DE ARQUIVO
========================================================= */

function getFileType(filename) {

    const extension =
        filename
            .split(".")
            .pop()
            .toLowerCase();


    if (extension === "pdf") {

        return "Docs";

    }


    if (
        [
            "jpg",
            "jpeg",
            "png",
            "gif",
            "webp",
            "svg"
        ].includes(extension)
    ) {

        return "Imagens";

    }


    if (
        [
            "mp3",
            "wav",
            "ogg",
            "m4a",
            "aac"
        ].includes(extension)
    ) {

        return "Áudio";

    }


    if (
        [
            "mp4",
            "webm",
            "mov",
            "m4v",
            "avi"
        ].includes(extension)
    ) {

        return "Vídeo";

    }


    return null;

}


/* =========================================================
   NOME BONITO
========================================================= */

function prettyName(filename) {

    let name =
        filename
            .split("/")
            .pop();


    name =
        name.replace(
            /\.[^/.]+$/,
            ""
        );


    name =
        name.replace(
            /[-_]+/g,
            " "
        );


    name =
        name.replace(
            /\b\w/g,
            letter =>
                letter.toUpperCase()
        );


    return name;

}


/* =========================================================
   ÍCONES
========================================================= */

function getIcon(type) {

    switch (type) {

        case "Docs":
            return "📄";

        case "Imagens":
            return "🖼️";

        case "Áudio":
            return "🎧";

        case "Música":
            return "🎵";

        case "Vídeo":
            return "🎬";

        default:
            return "📁";

    }

}


/* =========================================================
   NOME VISÍVEL
========================================================= */

function getDisplayType(type) {

    switch (type) {

        case "Docs":
            return "Docs";

        case "Imagens":
            return "Imagens";

        case "Áudio":
            return "Áudio";

        case "Música":
            return "Música";

        case "Vídeo":
            return "Vídeo";

        default:
            return type;

    }

}


/* =========================================================
   CARREGAR RECURSOS
========================================================= */

async function loadResources() {

    const grid =
        document.getElementById(
            "resourceGrid"
        );


    try {

        const folderEntries =
            Object.entries(
                RESOURCE_FOLDERS
            );


        const results =
            await Promise.all(

                folderEntries.map(

                    async ([type, folder]) => {

                        const files =
                            await getFilesFromFolder(
                                folder
                            );


                        return files

                            .map(file => {

                                const detectedType =
                                    getFileType(
                                        file.name
                                    );


                                /*
                                    ÁUDIO
                                */

                                if (
                                    type === "Áudio"
                                ) {

                                    if (
                                        detectedType !==
                                        "Áudio"
                                    ) {

                                        return null;

                                    }

                                }


                                /*
                                    VÍDEO
                                */

                                if (
                                    type === "Vídeo"
                                ) {

                                    if (
                                        detectedType !==
                                        "Vídeo"
                                    ) {

                                        return null;

                                    }

                                }


                                /*
                                    IMAGENS
                                */

                                if (
                                    type === "Imagens"
                                ) {

                                    if (
                                        detectedType !==
                                        "Imagens"
                                    ) {

                                        return null;

                                    }

                                }


                                /*
                                    DOCUMENTOS
                                */

                                if (
                                    type === "Docs"
                                ) {

                                    if (
                                        detectedType !==
                                        "Docs"
                                    ) {

                                        return null;

                                    }

                                }


                                /*
                                    MÚSICA

                                    Música também aceita
                                    arquivos de áudio.
                                */

                                if (
                                    type === "Música"
                                ) {

                                    const extension =
                                        file.name
                                            .split(".")
                                            .pop()
                                            .toLowerCase();


                                    if (
                                        ![
                                            "mp3",
                                            "wav",
                                            "ogg",
                                            "m4a",
                                            "aac"
                                        ].includes(
                                            extension
                                        )
                                    ) {

                                        return null;

                                    }

                                }


                                const resource = {

                                    name:
                                        prettyName(
                                            file.name
                                        ),

                                    type:
                                        type,

                                    url:
                                        file.html_url,

                                    rawUrl:
                                        file.download_url,

                                    path:
                                        file.path,

                                    filename:
                                        file.name

                                };


                                /*
                                    OTIMIZAÇÃO IMPORTANTE

                                    Guardamos o nome já
                                    convertido para minúsculas.

                                    Assim não precisamos executar
                                    toLowerCase() toda vez
                                    que o usuário digita.
                                */

                                resource.searchName =
                                    resource.name
                                        .toLocaleLowerCase(
                                            "pt-BR"
                                        );


                                return resource;

                            })

                            .filter(Boolean);

                    }

                )

            );


        allResources =
            results.flat();


        allResources.sort(

            (a, b) =>
                a.name.localeCompare(
                    b.name,
                    "pt-BR",
                    {
                        sensitivity:
                            "base"
                    }
                )

        );


        createFilters();

        renderResources();

    }


    catch (error) {

        console.error(
            "Erro ao carregar recursos:",
            error
        );


        grid.innerHTML = `

            <div class="message">

                Não foi possível carregar os recursos.

                <br><br>

                Verifique se o repositório do GitHub
                é público e se os dados de configuração
                estão corretos.

            </div>

        `;


        document.getElementById(
            "resourceCounter"
        ).textContent =
            "Não foi possível carregar os recursos.";

    }

}


/* =========================================================
   FILTROS
========================================================= */

function createFilters() {

    const container =
        document.getElementById(
            "filters"
        );


    /*
        EXATAMENTE 6 OPÇÕES

        Todos | Docs | Imagens
        Áudio | Música | Vídeo
    */

    const types = [

        "Todos",

        "Docs",

        "Imagens",

        "Áudio",

        "Música",

        "Vídeo"

    ];


    container.innerHTML =
        "";


    types.forEach(type => {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "filter-button" +
            (
                type === "Todos"
                    ? " active"
                    : ""
            );


        button.textContent =
            `${getIcon(type)} ${getDisplayType(type)}`;


        button.onclick = () => {

            currentFilter =
                type;


            document
                .querySelectorAll(
                    ".filter-button"
                )
                .forEach(btn =>
                    btn.classList.remove(
                        "active"
                    )
                );


            button.classList.add(
                "active"
            );


            renderResources();

        };


        container.appendChild(
            button
        );

    });

}


/* =========================================================
   MOSTRAR / FILTRAR RECURSOS
========================================================= */

/*
    IMPORTANTE:

    Esta função agora NÃO recria as tarjetas
    a cada letra da busca.

    As tarjetas são criadas uma única vez.
    Depois apenas mostramos ou ocultamos
    as existentes.
*/

function renderResources() {

    const grid =
        document.getElementById(
            "resourceGrid"
        );


    /*
        PRIMEIRA EXECUÇÃO:

        Criamos todas as tarjetas somente
        uma vez.
    */

    let cards =
        grid.querySelectorAll(
            ".resource-card"
        );


    if (
        cards.length === 0 &&
        allResources.length > 0
    ) {

        grid.innerHTML =
            "";


        const fragment =
            document.createDocumentFragment();


        allResources.forEach(
            resource => {

                const card =
                    createResourceCard(
                        resource
                    );


                /*
                    Guardamos os dados
                    diretamente no DOM.

                    Isso deixa o filtro
                    ainda mais rápido.
                */

                card.dataset.name =
                    resource.searchName;

                card.dataset.type =
                    resource.type;


                fragment.appendChild(
                    card
                );

            }
        );


        grid.appendChild(
            fragment
        );


        cards =
            grid.querySelectorAll(
                ".resource-card"
            );

    }


    /*
        TEXTO DA BUSCA

        Só fazemos trim e lowercase
        uma vez por pesquisa.
    */

    const search =
        currentSearch
            .trim()
            .toLocaleLowerCase(
                "pt-BR"
            );


    let visibleCount =
        0;


    /*
        FILTRAMOS AS TARJETAS EXISTENTES.

        NÃO recriamos HTML.
        NÃO recriamos áudios.
        NÃO recriamos vídeos.
        NÃO recriamos imagens.
    */

    cards.forEach(
        card => {

            const matchesType =
                currentFilter === "Todos" ||
                card.dataset.type ===
                currentFilter;


            const matchesSearch =
                search === "" ||
                card.dataset.name.includes(
                    search
                );


            const visible =
                matchesType &&
                matchesSearch;


            if (visible) {

                card.style.display =
                    "";

                visibleCount++;

            }

            else {

                card.style.display =
                    "none";

            }

        }
    );


    /*
        CONTADOR
    */

    document.getElementById(
        "resourceCounter"
    ).textContent =

        `${visibleCount} recurso` +

        `${
            visibleCount === 1
                ? ""
                : "s"
        }`;


    /*
        MENSAGEM DE SEM RESULTADOS
    */

    let noResults =
        grid.querySelector(
            ".search-no-results"
        );


    if (
        visibleCount === 0 &&
        allResources.length > 0
    ) {

        if (!noResults) {

            noResults =
                document.createElement(
                    "div"
                );

            noResults.className =
                "message search-no-results";

            noResults.textContent =
                "Nenhum recurso encontrado.";

            grid.appendChild(
                noResults
            );

        }


        noResults.style.display =
            "";

    }

    else if (noResults) {

        noResults.style.display =
            "none";

    }

}


/* =========================================================
   CRIAR CARTÃO DE RECURSO
========================================================= */

function createResourceCard(

) {

            "article"
        );

            "div"
        );

        resource.type ===
        "Imagens"
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            resource.rawUrl;


        image.alt =
            resource.name;


        image.loading =
            "lazy";


        image.onclick = () => {

            window.open(
                resource.rawUrl,
                "_blank",
                "noopener"
            );

        };


        preview.appendChild(
            image
        );

    }


    /* =====================================================
       ÁUDIO
    ===================================================== */

    else if (
        resource.type ===
        "Áudio"
    ) {

        preview.innerHTML = `

                <div class="audio-icon">
                    🎧
                </div>

                <audio
                    controls
                    preload="none"
                >

                    <source
                        src="${escapeAttribute(
                            resource.rawUrl
                        )}"
                    >

                    Seu navegador não consegue
                    reproduzir este áudio.

                </audio>

            </div>

        `;

    }


    /* =====================================================
       MÚSICA
    ===================================================== */

    else if (
        resource.type ===
        "Música"
    ) {

        preview.innerHTML = `

            <div class="audio-preview">

                <div class="audio-icon">
                    🎵
                </div>

                <audio
                    controls
                    preload="none"
                >

                    <source
                        src="${escapeAttribute(
                            resource.rawUrl
                        )}"
                    >

                    Seu navegador não consegue
                    reproduzir esta música.

                </audio>

            </div>

        `;

    }


    /* =====================================================
       VÍDEO
    ===================================================== */

    else if (
        resource.type ===
        "Vídeo"
    ) {

        const video =
            document.createElement(
                "video"
            );


        video.src =
            resource.rawUrl;


        video.controls =

        video.preload =

        video.setAttribute(

        );


        preview.appendChild(

        );

    }


    /* =====================================================
       DOCUMENTOS
    ===================================================== */

    else {

        preview.innerHTML = `

            <div class="resource-icon">

                ${getIcon(

    }


    /* =====================================================
       CONTEÚDO
    ===================================================== */

        );

    /* =====================================================
       DOCUMENTOS
    ===================================================== */

    if (
        resource.type ===

    ) {

        actions = `

                class="resource-button primary"
                href="${escapeAttribute(
                    resource.rawUrl
                )}"

            </a>

    }


    /* =====================================================
       IMAGEM
    ===================================================== */

    else if (
        resource.type ===
        "Imagens"
    ) {

        actions = `

            <a
                class="resource-button primary"
                href="${escapeAttribute(
                    resource.rawUrl
                )}"
                target="_blank"
                rel="noopener"
            >
                Ver
            </a>

            <a
                class="resource-button"
                href="${escapeAttribute(
                    resource.rawUrl
                )}"
                download
            >
                Baixar
            </a>

        `;

    }


    /* =====================================================
       ÁUDIO / MÚSICA
    ===================================================== */

    else if (

    ) {

                class="resource-button primary"

                    resource.rawUrl
                )}"
                download
            >

    }


    /* =====================================================
       VÍDEO
    ===================================================== */

    else if (

    ) {

                    resource.rawUrl
                )}"

        `;

    }


    content.innerHTML = `

        <div class="resource-type">

            ${getIcon(

            )}

            ${escapeHTML(
                getDisplayType(
                    resource.type
                )
            )}

            ${escapeHTML(
                resource.name
            )}

        </div>

    );

    );

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================================================
   ESCAPAR ATRIBUTOS
========================================================= */

function escapeAttribute(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


/* =========================================================
   BUSCA — OTIMIZADA
========================================================= */

/*
    Não chamamos renderResources()
    diretamente em cada evento de teclado.

    requestAnimationFrame permite que o navegador
    processe primeiro a entrada do teclado e depois
    atualize os resultados.

    Isso evita a sensação de teclado congelado.
*/

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        event => {

            currentSearch =
                event.target.value;


            if (
                searchFrame !== null
            ) {

                cancelAnimationFrame(
                    searchFrame
                );

            }


            searchFrame =
                requestAnimationFrame(
                    () => {

                        renderResources();

                        searchFrame =
                            null;

                    }
                );

        }
    );

async function loadNews() {

    const container =
        document.getElementById(
            "newsContainer"
        );


    try {

        const files =
            await getFilesRecursively(
                NEWS_FOLDER
            );


        const textFiles =
            files.filter(
                file => {

                    const extension =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    return (
                        extension ===
                        "txt"
                    );

                }
            );


        /*
            Primeiro lemos todas as notícias.

            Depois ordenamos usando a data
            presente na segunda linha.
        */

        const newsList =
            [];


        for (
            const file
            of textFiles
        ) {

            try {

                const rawUrl =
                    `https://raw.githubusercontent.com/` +
                    `${GITHUB_USER}/` +
                    `${GITHUB_REPO}/` +
                    `${GITHUB_BRANCH}/` +
                    `${file.path}`;


                const response =
                    await fetch(
                        rawUrl
                    );


                if (!response.ok) {

                    continue;

                }


                const text =
                    await response.text();


                const news =
                    parseNews(
                        text,
                        file.name
                    );


                news.rawUrl =
                    rawUrl;


                newsList.push(
                    news
                );

            }

            catch (error) {

                console.error(
                    "Erro ao ler notícia:",
                    file.name,
                    error
                );

            }

        }


        /*
            ORDENAÇÃO POR DATA

            DD/MM/YYYY

            Mais nova primeiro.
        */

        newsList.sort(
            (a, b) => {

                const dateA =
                    parseDate(
                        a.date
                    );

                const dateB =
                    parseDate(
                        b.date
                    );


                /*
                    Se as duas datas são válidas,
                    usamos a data real.
                */

                if (
                    dateA !== null &&
                    dateB !== null
                ) {

                    return (
                        dateB.getTime() -
                        dateA.getTime()
                    );

                }


                /*
                    Se apenas A tem data válida,
                    A vem primeiro.
                */

                if (
                    dateA !== null
                ) {

                    return -1;

                }


                /*
                    Se apenas B tem data válida,
                    B vem primeiro.
                */

                if (
                    dateB !== null
                ) {

                    return 1;

                }


                /*
                    Se nenhuma possui data válida,
                    mantemos ordem alfabética.
                */

                return a.title.localeCompare(
                    b.title,
                    "pt-BR",
                    {
                        sensitivity:
                            "base"
                    }
                );

            }
        );


        /*
            NENHUMA NOTÍCIA
        */

        if (
            newsList.length === 0
        ) {

            container.innerHTML = `

                <div class="message">

                    Não há notícias disponíveis.

                </div>

            `;

            return;

        }


        /*
            CRIAR CARTÕES
        */

        container.innerHTML =
            "";


        const fragment =
            document.createDocumentFragment();


        newsList.forEach(
            news => {

                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "news-card";


                /*
                    Guardamos os dados da notícia
                    diretamente no cartão.

                    Assim o clique não precisa
                    fazer outra requisição.
                */

                card.newsData =
                    news;


                card.innerHTML = `

                    <div class="news-date">

                        ${escapeHTML(
                            news.date
                        )}

                    </div>


                    <h3 class="news-title">

                        ${escapeHTML(
                            news.title
                        )}

                    </h3>

                `;


                /*
                    Abrir notícia completa
                */

                card.addEventListener(
                    "click",
                    () => {

                        openNews(
                            news
                        );

                    }
                );


                /*
                    Acessibilidade

                    Permite abrir com teclado.
                */

                card.setAttribute(
                    "tabindex",
                    "0"
                );


                card.setAttribute(
                    "role",
                    "button"
                );


                card.setAttribute(
                    "aria-label",
                    `Abrir notícia: ${news.title}`
                );


                card.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key ===
                            "Enter" ||
                            event.key ===
                            " "
                        ) {

                            event.preventDefault();

                            openNews(
                                news
                            );

                        }

                    }
                );


                fragment.appendChild(
                    card
                );

            }
        );


        container.appendChild(
            fragment
        );

    }


    catch (error) {

        console.error(
            "Erro ao carregar notícias:",
            error
        );


        container.innerHTML = `

            <div class="message">

                Não foi possível carregar as notícias.

            </div>

        `;

    }

}


/* =========================================================
   INTERPRETAR DATA DD/MM/YYYY
========================================================= */

function parseDate(dateString) {

    if (
        !dateString
    ) {

        return null;

    }


    /*
        Aceitamos exatamente:

        16/09/2026
    */

    const match =
        String(dateString)
            .trim()
            .match(
                /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
            );


    if (!match) {

        return null;

    }


    const day =
        Number(
            match[1]
        );


    const month =
        Number(
            match[2]
        );


    const year =
        Number(
            match[3]
        );


    /*
        JavaScript usa mês 0-11.
    */

    const date =
        new Date(
            year,
            month - 1,
            day
        );


    /*
        Validação adicional.

        Evita datas como:

        40/99/2026
    */

    if (
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
    ) {

        return null;

    }


    return date;

}


/* =========================================================
   FUNÇÃO PARA NOTÍCIAS RECURSIVAS
========================================================= */

async function getFilesRecursively(path) {

    const items =
        await githubContents(
            path
        );


    let files =
        [];


    for (
        const item
        of items
    ) {

        if (
            item.type ===
            "file"
        ) {

            files.push(
                item
            );

        }


        else if (
            item.type ===
            "dir"
        ) {

            const children =
                await getFilesRecursively(
                    item.path
                );


            files =
                files.concat(
                    children
                );

        }

    }


    return files;

}


/* =========================================================
   INTERPRETAR NOTÍCIA
========================================================= */

/*
    FORMATO DO TXT:

    Linha 1:
    Título

    Linha 2:
    Data

    Linha 3 em diante:
    Conteúdo
*/

function parseNews(
    text,
    filename
) {

    const lines =
        text.split(
            /\r?\n/
        );


    let title =
        prettyName(
            filename
        );


    let date =
        "";


    let content =
        text.trim();


    /*
        PRIMEIRA LINHA = TÍTULO
    */

    if (
        lines.length > 0
    ) {

        title =
            lines[0].trim();

    }


    /*
        SEGUNDA LINHA = DATA

        Formato:

        DD/MM/YYYY
    */

    if (
        lines.length > 1
    ) {

        date =
            lines[1].trim();

    }


    /*
        LINHAS RESTANTES = CONTEÚDO
    */

    if (
        lines.length > 2
    ) {

        content =
            lines
                .slice(2)
                .join("\n")
                .trim();

    }


    return {

        title:
            title,

        date:
            date,

        content:
            content

    };

}


/* =========================================================
   ABRIR NOTÍCIA
========================================================= */

function openNews(news) {

    const modal =
        document.getElementById(
            "newsModal"
        );


    const title =
        document.getElementById(
            "newsModalTitle"
        );


    const date =
        document.getElementById(
            "newsModalDate"
        );


    const content =
        document.getElementById(
            "newsModalText"
        );


    title.textContent =
        news.title;


    date.textContent =
        news.date;


    content.textContent =
        news.content;


    modal.classList.add(
        "active"
    );


    document.body.classList.add(
        "modal-open"
    );


    /*
        Volta o conteúdo da notícia
        para o início.
    */

    document.querySelector(
        ".news-modal-body"
    ).scrollTop = 0;


    /*
        Coloca o foco no botão fechar
        para acessibilidade.
    */

    setTimeout(
        () => {

            document
                .getElementById(
                    "newsClose"
                )
                .focus();

        },
        100
    );

}


/* =========================================================
   FECHAR NOTÍCIA
========================================================= */

function closeNews() {

    const modal =
        document.getElementById(
            "newsModal"
        );


    modal.classList.remove(
        "active"
    );


    document.body.classList.remove(
        "modal-open"
    );

}


/* =========================================================
   BOTÃO FECHAR
========================================================= */

document
    .getElementById(
        "newsClose"
    )
    .addEventListener(
        "click",
        closeNews
    );


/* =========================================================
   FECHAR AO CLICAR FORA
========================================================= */

document
    .getElementById(
        "newsModal"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "newsModal"
            ) {

                closeNews();

            }

        }
    );


/* =========================================================
   FECHAR COM ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            const modal =
                document.getElementById(
                    "newsModal"
                );


            if (
                modal.classList.contains(
                    "active"
                )
            ) {

                closeNews();

            }

        }

    }
);


/* =========================================================
   CARROSSEL DE NOTÍCIAS
========================================================= */

function scrollNews(
    direction
) {

    const container =
        document.getElementById(
            "newsContainer"
        );


    const amount =
        container.clientWidth *
        0.8;


    container.scrollBy({

        left:
            amount * direction,

        behavior:
            "smooth"

    });

}


/* =========================================================
   INICIAR
========================================================= */

loadResources();

loadNews();


</script>
